id: leeds-compsoc-ctf-2026
name: Leeds CompSoc CTF 2026
password: LUCS26-CTF-SETUP

description: |
  Leeds Computing Society Capture the Flag competition.

  Work in teams of up to four and solve as many challenges as you can
  before the competition ends.

  You can attempt the challenges in any order. You do not need to
  complete the easier challenges before trying a harder one.

  Each challenge gives you a flag when you solve it. Submit the final
  pwn.college{...} flag on the challenge page to score.

  **How scoring works:**

  Every challenge is worth one point, whatever its level. Your team
  scores the point if anyone on the team solves it. If two people on
  the same team solve the same challenge, it still counts as one
  point, so work alone or in pairs on different challenges.

  **Your team name:**

  Add your team name in square brackets to the end of your username
  in Settings, for example `alex [Cipher]`. Spell it exactly as it is
  written on your team card. If it is wrong, your points will not
  count for your team.

  **The leaderboard:**

  The live leaderboard updates slowly, so do not rely on it. We work
  out the final scores from the pwn.college records when hacking
  stops. Tick off each flag on your team sheet as a backup.

  **Never done a CTF before?**

  Start with the Beginner challenges. They walk you through every step
  and introduce the tools you need as you go.

  **Important things to know:**

  Each challenge runs inside pwn.college. Use the Terminal for
  command-line challenges.

  If a challenge uses localhost or 127.0.0.1, open Firefox inside the
  pwn.college Desktop. Your normal browser is outside the virtual
  computer and cannot reach it.

  If you need to move text between the virtual computer and your
  normal browser, use the Clipboard panel in the side tab of the
  pwn.college Desktop.

  If you get stuck on a challenge, ask your team or use SENSAI, the
  AI helper built into pwn.college. Start your challenge first, then
  use the Help link at the top of the page to access SENSAI.
  Volunteers can help with technical problems, such as logging in,
  the Desktop or your team name, but cannot give hints.

modules:

  - id: beginner
    name: "🟢 Beginner"
    description: |
      Never done a CTF before? Start here.

      These challenges introduce basic commands and simple ideas.
      You do not need previous cybersecurity or programming experience.

      The Terminal is where you type instructions for the computer. You
      will use it to find files, search for information and run the tools
      you need to solve challenges.

      You can complete the challenges in any order.

      If you get stuck, try working it out with your team first. You can
      also use SENSAI through the Help option on pwn.college.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: grep-master
        name: "Grep Master"
        description: |
          *Search a huge file for hidden text using grep.*

          You have found a huge text file called `haystack.txt`. Somewhere
          inside it is a needle: a hidden temporary flag that looks like
          `FLAG{...}`.

          The file is far too big to read yourself. Instead, you will use
          a command to search it for you.

          `grep` searches a file and shows you every line that contains
          the text you ask for. Investigators use it to search huge
          files in seconds. You use it like this:

          grep "something to search for" filename

          grep is case-sensitive, so `FLAG` and `flag` are different
          searches.

          1. Press Start. This opens the challenge and a Terminal, which
             is where you type instructions for the computer.

          2. Go to the challenge folder:

             cd /challenge

             `cd` means change directory. It moves you into a different
             folder.

          3. List the files in the folder:

             ls

             You should see `haystack.txt`. It is a file, not a folder,
             so you do not need to `cd` into it.

          4. Use grep to search `haystack.txt` for the start of the flag,
             `FLAG{`.

          5. When you find the complete temporary flag, run:

             /challenge/verify

             and type in the whole flag, including `FLAG{` and `}`. Type
             it exactly, with no spaces.

          6. If it is correct, the verifier gives you your final
             pwn.college{...} flag. Submit it on the challenge page.

          grep searches files for text, so you never need to read a huge
          file yourself.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: unlock-the-vault
        name: "Unlock the Vault"
        description: |
          *Find a password hidden in a clue file and use it to open a
          locked ZIP.*

          You are a treasure hunter who has found a locked vault. The
          vault is a file called `vault.zip`, and the treasure (a
          temporary flag) is inside it. The password is hidden somewhere
          in another file, `vault_clue.txt`.

          A `.zip` file has been compressed: one or more files squashed
          together so they take up less space. To open one, you use the
          `unzip` command.

          On this computer you are not allowed to create files inside
          `/challenge`, so you need to tell `unzip` to put the files in
          your home folder instead, using `-d`:

          unzip filename.zip -d /home/hacker

          This vault is locked, so `unzip` will ask you for a password.

          1. Press Start to open the challenge and a Terminal.

          2. Go to the challenge folder and list the files:

             cd /challenge
             ls

          3. Use grep to search `vault_clue.txt` for the password. If you
             have not used grep before, try Grep Master first.

          4. Unzip the vault into your home folder:

             unzip vault.zip -d /home/hacker

          5. Enter the password when asked. Nothing appears while you
             type it. This is normal, so just type it and press Enter.

          6. Go to your home folder and list the files:

             cd /home/hacker
             ls

             You should see a new file that came out of the vault.

          7. Read it with `cat`, followed by the file name:

             cat filename

             Replace `filename` with the name of the file you found.

          8. Run:

             /challenge/verify

             and type in the complete temporary `FLAG{...}`.

          9. Submit your final pwn.college{...} flag on the challenge
             page.

          Clues often lead to other clues. Here, one file held the
          password to another.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: the-artists-clue
        name: "The Artist's Clue"
        description: |
          *Find a flag hidden in the metadata of an image.*

          You are a detective investigating a mysterious painting,
          `art.jpg`, made by a secretive artist. The flag is not in the
          picture you can see. It is hidden in the image's metadata.

          Metadata is hidden information stored inside a file that
          describes it: when a photo was taken, what camera was used,
          who made it, and sometimes notes from the creator.

          `exiftool` is a program that reads metadata from images,
          videos and documents. Photographers use it to check camera
          settings, and investigators use it to find out who made a file
          and when. You use it like this:

          exiftool filename

          1. Press Start to open the challenge and a Terminal.

          2. Go to the folder containing the image:

             cd /home/ubuntu/Artists-Clue

          3. List the files. You should see `art.jpg`:

             ls

          4. Use exiftool on the image. Replace `filename` with the
             image's name.

          5. exiftool prints a lot of lines. Read every one of them. You
             are looking for a temporary flag that starts with `FLAG{`.

          6. Run:

             /challenge/verify

             and type in the complete temporary flag exactly, with no
             spaces.

          7. Submit your final pwn.college{...} flag on the challenge
             page.

          Files can carry hidden information called metadata, and
          exiftool reads it. Real investigators use this to trace where
          photos came from.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: pale-red-horse-squad
        name: "Pale Red Horse Squad"
        description: |
          *Find a hidden passphrase on a webpage using Developer Tools.*

          Everyone is talking about a new secret club, but it is so
          exclusive that nobody can get in. Rumour says the entry
          passphrase is sitting somewhere on the club's webpage. Can you
          find it?

          This website runs on the pwn.college virtual computer, not on
          the internet. Its address is `127.0.0.1`, which means "this
          computer". That is why you must use Firefox inside the
          pwn.college Desktop: your normal browser is outside the
          virtual computer and cannot reach it.

          Webpages contain more than what you see on screen. Firefox has
          Developer Tools that show how a page is built. Open them by
          pressing F12. You do not need any web development experience.

          1. Press Start to open the challenge and a Terminal.

          2. Go to the challenge folder:

             cd /challenge

          3. Start the website:

             ./verify

             Leave this Terminal running while you use the website.

          4. At the bottom of the Terminal, click the Desktop button
             (next to the Code button). The pwn.college Desktop opens in
             a new tab.

          5. Open Firefox inside the Desktop.

          6. Click the address bar, type this and press Enter:

             http://127.0.0.1:5000

          7. Look around the page for the passphrase. If you cannot see
             it, use Developer Tools to look behind the page.

          8. Enter the passphrase into the webpage. It gives you a
             pwn.college{...} flag.

          9. Submit the flag on the challenge page. To copy it out of the
             Desktop, use the Clipboard panel in the side tab.

          Webpages contain information visitors cannot see, and
          Developer Tools shows it.

          Use SENSAI through the Help link at the top of the page.

  - id: easy
    name: "🔵 Easy"
    description: |
      These challenges build on the skills introduced in Beginner and
      require you to investigate more carefully or combine multiple
      steps.

      The instructions give you enough information to get started, but
      you may need to work out the exact commands or approach yourself.

      If you need to move text between the pwn.college virtual computer
      and your normal browser:

      1. On the left-hand side of the pwn.college virtual computer,
         look for the grey arrow.

      2. Click the grey arrow to open the side panel.

      3. Click the Clipboard icon.

      4. Paste your text into the Clipboard panel.

      5. You can then copy the text from the Clipboard panel and paste
         it into Firefox inside the pwn.college Desktop, or the other
         way around.

      If you get stuck, use SENSAI through the Help link for a hint.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: chatty-server
        name: "Chatty Server"
        description: |
          *Investigate a busy server log to find a flag hidden in
          pieces.*

          You are a cybersecurity analyst investigating a server's
          activity log, `server.log`. One user did something sneaky and
          hid a temporary flag in it, split into three pieces across
          different entries.

          Only one of the real pieces contains `FLAG{`, so searching for
          FLAG alone will not find them all. The log also contains fake
          flags to throw you off, so check that the pieces you find
          really belong together.

          A server log is a record a server keeps automatically of
          everything that happens: users logging in and out, uploading
          files, changing passwords and more. Each line usually shows
          when something happened, who did it and what they did.

          1. Press Start to open the challenge and a Terminal.

          2. Go to the challenge folder:

             cd /home/ubuntu/Chatty-Server

          3. Get a feel for the log before you search it. It is very
             long, so instead of printing all of it, try:

             head server.log

             This shows the first 10 lines. Work out what each part of a
             line tells you.

          4. Use `grep` to search the log. Start with what you know, then
             use what you find to narrow your search. Think about who hid
             the flag and what they were doing.

          5. Put the three pieces together in the right order to make the
             complete temporary flag. The timestamps will help.

          6. Run `/challenge/verify` and enter the complete temporary
             flag.

          7. Submit your final pwn.college{...} flag on the challenge
             page.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: osint
          challenge: socialmediapassword
        name: "Social Media Password"
        description: |
          *Use clues from social media posts to work out a password.*

          You are investigating a fake social media profile belonging to
          `@random_dude12`. The profile has three posts. Use what they
          reveal to work out their password.

          OSINT (Open Source Intelligence) means gathering information
          that people share publicly. Attackers use it to guess
          passwords, because many people build passwords from things
          they also post about: a pet's name, a hobby, a birth year.
          For example: Rex123! or ILoveFishing99.

          Capital letters, numbers and symbols all matter.

          1. Press Start, then start the website:

             /challenge/run

             Leave this Terminal running.

          2. Open the Desktop, launch Firefox and go to:

             http://127.0.0.1:5000

          3. Read the three posts and note every name, number and detail
             that could be part of a password.

          4. Open a second Terminal in the Desktop and run:

             /challenge/verify

          5. Enter your password guess. If it is correct, you get your
             final pwn.college{...} flag.

          6. Submit the flag on the challenge page.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: locked-treasure-chest
        name: "Locked Treasure Chest"
        description: |
          *Find a flag hidden in the metadata of a ZIP file.*

          You have found a digital treasure chest,
          `digital_treasure.zip`, with another ZIP file hidden inside
          it called `treasure.zip`. The flag is not inside
          `treasure.zip`. It is hidden in information about it.

          ZIP files store information about the files inside them, such
          as names, sizes, dates and permissions. They can also store
          comments added by whoever made the ZIP.

          `zipinfo` shows this information without unzipping anything.
          It does not show everything by default, so you may need to try
          its options. Run `zipinfo -h` to see them.

          1. Press Start to open the challenge and a Terminal.

          2. Go to the challenge folder:

             cd /challenge

          3. Unzip `digital_treasure.zip` into your home folder. No
             password is needed. If you need a reminder of how, run
             `unzip` on its own.

          4. Go to your home folder and find `treasure.zip`.

             Do NOT unzip `treasure.zip`. You will lose the flag.

          5. Use `zipinfo` and its options on `treasure.zip` until you
             find the temporary `FLAG{...}`.

          6. Run `/challenge/verify` and enter the temporary flag.

          7. Submit your final pwn.college{...} flag on the challenge
             page.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin
        name: "Am I Admin?"
        description: |
          *Tamper with a browser cookie to gain admin access.*

          This website decides whether you are a normal user or an
          administrator. Can you convince it you are an admin?

          Websites often remember who you are using cookies: small
          pieces of data stored in your browser. But anything stored in
          your browser can be changed by you. Developers who forget this
          leave their apps open to attack.

          1. Press Start, then start the web application:

             /challenge/app.py

             Leave this Terminal running.

          2. Open the Desktop, launch Firefox and go to:

             http://127.0.0.1:5000

          3. Press F12 to open Developer Tools, then go to the Storage
             tab and open Cookies.

          4. Look at the cookie names and values. What could you change
             to make the website treat you as an admin?

          5. Change the cookie, then refresh the page.

          6. If it works, the admin page shows you the pwn.college{...}
             flag. Submit it on the challenge page, using the Clipboard
             panel to copy it out of the Desktop.

          Use SENSAI through the Help link at the top of the page.

  - id: medium
    name: "🟠 Medium"
    description: |
      These challenges require you to combine ideas, investigate more
      carefully or understand a security concept.

      Each challenge tells you what you are trying to do and how to get
      started, but not every step. You will need to think about how
      things work and try different approaches.

      If you get stuck, use SENSAI through the Help link on pwn.college.
      Tell it what you have tried so far for better hints.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: secret-message-in-photo
        name: "Secret Message in Photo"
        description: |
          *Extract a secret message hidden inside an image.*

          You are a spy who has found a picture of a suspicious dog. It
          is hiding a secret message, protected by a passphrase. Find the
          passphrase, then extract the message.

          Steganography means hiding data inside another file, such as
          an image, so nobody can tell it is there. `steghide` can hide
          and extract data this way. Run `steghide --help` to see its
          options.

          1. Press Start to open the challenge and a Terminal.

          2. Go to the challenge folder and list the files:

             cd /home/ubuntu/Secret-Message-in-Photo
             ls

          3. Investigate the files to find the passphrase.

          4. Use `steghide` with the passphrase to extract the hidden
             data from the image.

             You cannot create files in this folder. Use steghide's
             `-xf` option to save the extracted data in your home
             folder, for example `-xf /home/hacker/temp_flag.txt`.

          5. Read what you extracted to find the temporary `FLAG{...}`.

          6. Run `/challenge/verify` and enter the temporary flag.

          7. Submit your final pwn.college{...} flag on the challenge
             page.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: magic-number
        name: "Magic Number"
        description: |
          *Inspect a program to discover its secret numbers, then make
          the computer do the guessing for you.*

          A program asks you to guess a secret number between 1 and 1000.
          There are four possible secret numbers, and each time the
          program runs it picks one of them. Guess correctly and it
          prints a special string you can exchange for the flag.

          Compiled programs are not human-readable, but they still
          contain readable text mixed in with the machine code. The
          `strings` command pulls that text out of a file. It prints a
          lot, and not everything it calls a string will make sense.

          1. Press Start to open the challenge and a Terminal.

          2. Look at the readable text inside the program:

             strings /challenge/magic_numbers

             Find the four possible numbers. They may not look the way
             you expect.

          3. Run the program and see how it behaves:

             /challenge/magic_numbers

          4. Guessing by hand works, but it is slow. Can you write a
             short command or script that keeps trying until it wins?

          5. When you guess correctly, the program prints a special
             string. Run `/challenge/verify` and enter that string.

          6. Submit your final pwn.college{...} flag on the challenge
             page.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: hidden-treasures-in-the-picture
        name: "Hidden Treasures in the Picture"
        description: |
          *Find four flag pieces hidden in an image using several
          forensics techniques.*

          You are a digital archaeologist exploring a mysterious image,
          `treasure.jpg`. To keep the flag safe, it has been split into
          four pieces, each hidden in a different way. No single tool
          will find them all.

          Each piece is labelled, like `Part 1: ...` through
          `Part 4: ...`.

          These may be useful: `strings`, `grep`, `exiftool`,
          `steghide` and `binwalk`. Some tools show you information
          about a file. Others pull hidden data out of it. If a tool
          extracts something, investigate that too. Hidden files can
          hide other files. If you are not sure how a tool works, try
          its `--help` option.

          1. Press Start to open the challenge and a Terminal.

          2. The image is at `/challenge/treasure.jpg`. You cannot create
             files in `/challenge`, so work from your home folder:

             cd ~

          3. Investigate the image with different tools and keep a note
             of each part as you find it. For steghide, use
             `-xf /home/hacker/extracted.txt` to choose where the output
             is saved.

          4. When you have all four, join them in order (Part 1, 2, 3, 4)
             inside `FLAG{...}` to make the complete temporary flag.

          5. Run `/challenge/verify` and enter the temporary flag.

          6. Submit your final pwn.college{...} flag on the challenge
             page.

          Do not print the image with `cat`. It is not text, so it fills
          the Terminal with junk. If that happens, type `reset` and
          press Enter.

          Use SENSAI through the Help link at the top of the page. Tell
          it which tools you have tried and which parts you have found.

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin-2
        name: "Am I Admin 2?"
        description: |
          *Read a web application's source code to forge an admin
          cookie.*

          You figured out how to become an admin in Am I Admin? (in the
          Easy module). The developers have fixed that: simply editing
          the cookie no longer works, because the app now checks it in a
          smarter way. They think they are safe now.

          This time you have the Python source code behind the website.
          Work out how the cookie is created and checked, then make one
          the website accepts as an admin.

          1. Press Start, then start the web application:

             /challenge/app.py

             Leave this Terminal running.

          2. Open Firefox inside the Desktop and go to:

             http://127.0.0.1:5000

          3. Look at the cookie the website sets (F12, then Storage).

          4. Read the Python code in `/challenge`. Pay attention to which
             libraries are imported and how the cookie value is built
             and checked.

          5. Create a cookie value that makes the website treat you as
             an admin, set it in your browser and refresh the page.

          6. If you succeed, the website shows you the pwn.college{...}
             flag. Submit it on the challenge page.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: reverse-password-plaintext
        name: "Reverse Plaintext Password"
        description: |
          *Trace a Python program to reconstruct the password it
          builds.*

          A Python program builds a password using four functions. Each
          function picks characters from two lists, `alphabet` and
          `special_char`. You have the full source code, so the
          challenge is not guessing, it is reading carefully. Attention
          to detail is the key.

          1. Press Start and select the VS Code Workspace.

          2. Open the program: press Ctrl+O and type:

             /challenge/plaintextPassword.py

          3. Trace each function in the order it is called. Watch how
             the lists are indexed. You can also run the program to see
             what the starting lists look like.

          4. When you have the password, open a terminal (Ctrl+`) and
             run:

             cd /challenge
             ./verify

             Enter the password to receive your pwn.college{...} flag.

          5. Submit the flag on the challenge page.

          Use SENSAI through the Help link at the top of the page.

  - id: hard
    name: "🔴 Hard"
    description: |
      These challenges are intended for participants who already have
      some programming or cybersecurity experience.

      Each challenge tells you what the goal is, but not how to reach
      it. The first two are reverse engineering. The last three are
      binary exploitation and get harder in order. The final one is
      the toughest challenge in the competition.

      Read the code. Experiment. Break things.

      If you get stuck, use SENSAI through the Help link on pwn.college.

    challenges:

      - import:
          dojo: cse466-f2025
          module: reverse-engineering
          challenge: terrible-token-hard
        name: "Terrible Token"
        description: |

          Reverse engineer this challenge to find the correct license
          key.

          The program is at `/challenge/terrible-token-hard`. Run it,
          type a key and press Enter. The correct key prints your
          pwn.college{...} flag.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: cse466-f2025
          module: reverse-engineering
          challenge: tangled-ticket-hard
        name: "Tangled Ticket"
        description: |

          Reverse engineer this challenge to find the correct license
          key, but your input will be modified somehow before being
          compared to the correct key.

          The program is at `/challenge/tangled-ticket-hard`. Run it,
          type a key and press Enter. The correct key prints your
          pwn.college{...} flag.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: intro-to-cybersecurity
          module: binary-exploitation
          challenge: control-hijack-2
        name: "Tricky Control Hijack"
        description: |
          *Overflow a buffer to take control of where the program goes
          next.*

          This program has a buffer overflow. Somewhere inside it is
          code that prints the flag, but the program never runs it on
          its own. Overflow the buffer to hijack the program's control
          flow and make it run that code.

          You do not get the source code. You will need to reverse
          engineer the program to work out how much to overflow and
          where to send it.

          Run the program to see how it behaves:

          /challenge/binary-exploitation-control-hijack-2

          The official challenge notes are in `/challenge/DESCRIPTION.md`.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: intro-to-cybersecurity
          module: binary-exploitation
          challenge: pie-overflow
        name: "PIEs"
        description: |
          *Hijack control flow in a program whose addresses change every
          time it runs.*

          Overflow a buffer and smash the stack to obtain the flag, but
          this time the program is a Position Independent Executable
          (PIE). It is loaded at a different address every time it
          runs, so you cannot simply jump to a fixed address.

          You do not get the source code. Think about which parts of an
          address change between runs and which parts stay the same.

          Run the program to see how it behaves:

          /challenge/binary-exploitation-pie-overflow

          The official challenge notes are in `/challenge/DESCRIPTION.md`.

          Use SENSAI through the Help link at the top of the page.

      - import:
          dojo: intro-to-cybersecurity
          module: binary-exploitation
          challenge: hijack-to-shellcode
        name: "Hijack to Shellcode"
        description: |
          *The final challenge: inject your own code and make the
          program run it.*

          This time there is no helpful code inside the program that
          prints the flag. You will have to write it yourself.

          Write shellcode (machine code) that reads the flag, inject it
          into the program, and use a buffer overflow to make the
          program run it. This combines everything: reverse
          engineering, overflows, controlling execution and writing
          shellcode.

          Run the program to see how it behaves:

          /challenge/binary-exploitation-hijack-to-shellcode

          The official challenge notes are in `/challenge/DESCRIPTION.md`.

          Use SENSAI through the Help link at the top of the page.
